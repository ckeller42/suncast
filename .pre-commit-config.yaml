# Single source of truth for lint/format/secret-scan tool versions (local hooks + CI).
# Install once: uv run --extra dev pre-commit install
default_install_hook_types: [pre-commit, pre-push]
exclude: ^suncast/static/vendor/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged diff: it guards commits, but finds nothing under --all-files.
      - id: gitleaks
        args: [--config, .gitleaks.toml]
      # Whole-working-tree scan, same pinned version; CI runs it via --hook-stage manual.
      - id: gitleaks
        alias: gitleaks-dir
        name: Detect hardcoded secrets (working tree)
        entry: gitleaks dir --redact --verbose --config .gitleaks.toml .
        pass_filenames: false
        stages: [manual]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        # Offline: the online audits need a GitHub token, which the CI job does not have.
        args: [--no-progress, --offline]
  # Keep in step with the ruff==0.16.9 pin in pyproject.toml's dev extra.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --extra dev pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
