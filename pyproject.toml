[project]
name = "suncast"
version = "0.2.0"
description = "Camper solar forecast with self-calibration (buspi)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "httpx>=0.27", "influxdb-client>=1.44"]

[project.optional-dependencies]
# ruff: keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.10", "pre-commit>=4"]
# Docs site (sphinx-build -W docs docs/_build/html); versions mirror open-california/docs/requirements.txt
docs = [
  "sphinx>=8,<9",
  "furo>=2025.12.19",
  "myst-parser>=5.1.0,<6",
  "sphinxcontrib-mermaid>=1,<2",
]

[project.scripts]
suncast = "suncast.app:main"
suncast-backfill = "suncast.backfill:main"
suncast-backtest = "suncast.backtest:main"

[tool.ruff]
line-length = 100
# ruff >= 0.16 also formats Python fences inside Markdown; the docs/ plans quote code as
# written at the time, so keep the formatter out of them.
extend-exclude = ["*.md"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["suncast*"]

[tool.setuptools.package-data]
suncast = [
  "templates/*.html",
  "static/*.js",
  "static/*.css",
  "static/vendor/leaflet/*.js",
  "static/vendor/leaflet/*.css",
  "static/vendor/leaflet/images/*",
]
