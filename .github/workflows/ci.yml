name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # PRs share a group per ref (superseded runs are cancelled); every push gets its own group,
  # because a shared group would still cancel an older *pending* run on main.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Never cancel a push to main; only superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Only the hook runner is needed (the pytest hook is pre-push); keep in step with uv.lock.
      - run: pip install "pre-commit==4.6.2"
      - run: pre-commit run --all-files --show-diff-on-failure
      # The gitleaks commit hook only scans staged changes, so scan the whole tree here.
      - run: pre-commit run --hook-stage manual gitleaks-dir --all-files
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Tests + coverage gate (pure modules >= 85%)
        run: |
          uv run --no-sync pytest -q --cov=suncast.calibrate --cov=suncast.config \
            --cov=suncast.providers.forecast_solar --cov=suncast.models --cov-fail-under=85
  # Not a required check: builds the Sphinx site with warnings as errors (the site is
  # published by a separate workflow once GitHub Pages is enabled).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra docs
      - run: uv run --no-sync sphinx-build -b html -W docs docs/_build/html
